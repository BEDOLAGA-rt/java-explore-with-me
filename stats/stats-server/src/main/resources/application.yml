server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stats
    username: stats
    password: stats
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always

logging:
  level:
    ru.practicum: DEBUG